<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suka Supreme Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            color: white;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .card-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .card-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .users-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #eee;
        }
        
        .users-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .user-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
        }
        
        .user-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }
        
        .user-item:hover {
            background: #f9f9f9;
        }
        
        .user-item:last-child {
            border-bottom: none;
        }
        
        .user-name {
            font-weight: 600;
            color: #333;
        }
        
        .user-level {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #666;
            font-size: 0.9em;
        }
        
        .emoji {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="emoji">🤖</span> Suka Supreme Bot</h1>
            <p>Dashboard & Statistiken</p>
        </div>
        
        <div class="status">
            <div class="status-dot"></div>
            <span id="status-text">Bot läuft...</span>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="emoji">👥</div>
                <div class="card-number" id="user-count">0</div>
                <div class="card-label">Aktive Benutzer</div>
            </div>
            <div class="card">
                <div class="emoji">💰</div>
                <div class="card-number" id="total-money">0</div>
                <div class="card-label">Gesamtvermögen</div>
            </div>
            <div class="card">
                <div class="emoji">🏠</div>
                <div class="card-number" id="total-houses">0</div>
                <div class="card-label">Häuser</div>
            </div>
            <div class="card">
                <div class="emoji">🚗</div>
                <div class="card-number" id="total-cars">0</div>
                <div class="card-label">Autos</div>
            </div>
        </div>
        
        <div class="users-section">
            <h2>Top Benutzer (nach Level)</h2>
            <div class="user-list" id="user-list">
                <div style="padding: 20px; text-align: center; color: #999;">
                    Lädt...
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 Suka Supreme Bot | Version 1.0.0</p>
        </div>
    </div>
    
    <script>
        // Lade Bot-Status
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                document.getElementById('status-text').textContent = `Bot läuft (${data.name})`;
            } catch (error) {
                document.getElementById('status-text').textContent = 'Bot läuft...';
            }
        }
        
        // Lade User-Daten
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const userData = await response.json();
                
                const users = Object.entries(userData).map(([id, data]) => ({
                    id,
                    name: id.split('@')[0],
                    level: data.level || 1,
                    xp: data.xp || 0,
                    money: data.money || 0,
                    houses: data.houses?.length || 0,
                    cars: data.cars?.length || 0
                }));
                
                // Statistiken
                const stats = {
                    users: users.length,
                    money: users.reduce((sum, u) => sum + u.money, 0),
                    houses: users.reduce((sum, u) => sum + u.houses, 0),
                    cars: users.reduce((sum, u) => sum + u.cars, 0)
                };
                
                document.getElementById('user-count').textContent = stats.users;
                document.getElementById('total-money').textContent = stats.money.toLocaleString('de-DE');
                document.getElementById('total-houses').textContent = stats.houses;
                document.getElementById('total-cars').textContent = stats.cars;
                
                // Sortiere nach Level
                users.sort((a, b) => b.level - a.level || b.xp - a.xp);
                
                // Zeige Top 10
                const userListHTML = users.slice(0, 10).map((user, i) => `
                    <div class="user-item">
                        <div>
                            <div style="margin-bottom: 5px;">
                                <strong>${i + 1}.</strong>
                                <span class="user-name">${user.name}</span>
                            </div>
                            <small style="color: #999;">Level: ${user.level} | XP: ${user.xp}</small>
                        </div>
                        <div class="user-level">Level ${user.level}</div>
                    </div>
                `).join('');
                
                document.getElementById('user-list').innerHTML = userListHTML || '<div style="padding: 20px; text-align: center; color: #999;">Keine Benutzer gefunden</div>';
            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
            }
        }
        
        // Starte Daten Laden
        loadStatus();
        loadUsers();
        
        // Aktualisiere alle 5 Sekunden
        setInterval(loadUsers, 5000);
    </script>
</body>
</html>
